<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>행동카툰 · 야구편</title><style>/* 플립북 (build_flipbook.py). 페이지는 480×720 로 설계하고 화면에 맞춰 통째로 확대·축소한다. 사진은 자르지 않는다. */

#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 10px 12px}
#book{margin:auto}
.page{background:var(--paper)}
.pin{position:absolute;left:0;top:0;width:480px;height:720px;box-sizing:border-box;overflow:hidden;transform-origin:0 0;transform:scale(var(--s,1));
  background:var(--paper) url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxODAnIGhlaWdodD0nMTgwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nLjgnIG51bU9jdGF2ZXM9JzMnIHN0aXRjaFRpbGVzPSdzdGl0Y2gnLz48ZmVDb2xvck1hdHJpeCB2YWx1ZXM9JzAgMCAwIDAgLjQgIDAgMCAwIDAgLjMyICAwIDAgMCAwIC4yMiAgMCAwIDAgLjEzIDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=");color:var(--txt)}
.page:nth-child(odd) .pin::after,.page:nth-child(even) .pin::after{content:"";position:absolute;top:0;bottom:0;width:26px;pointer-events:none;z-index:9}
.page:nth-child(even) .pin::after{right:0;background:linear-gradient(to left,rgba(70,50,30,.16),transparent)}
.page:nth-child(odd) .pin::after{left:0;background:linear-gradient(to right,rgba(70,50,30,.16),transparent)}
img{display:block;max-width:100%}
.folio{position:absolute;left:0;right:0;bottom:18px;text-align:center;font:400 11px "Cormorant Garamond",serif;letter-spacing:.35em;color:#b0a89e}

/* 본문 페이지 */
.mix .pin{padding:40px 30px 52px;display:flex;flex-direction:column;gap:16px}
.mix p{font-weight:300;font-size:15px;line-height:28px;margin:0;color:var(--txt);word-break:keep-all}
.ts{display:inline-block;font:400 9.5px "Noto Sans KR",sans-serif;color:#a39c94;border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-left:3px;vertical-align:2px}
.sh{padding-top:8px}
.sh .rn{font:italic 400 17px "Cormorant Garamond",serif;color:#a39c94}
.sh h3{margin:2px 0 0;font-weight:400;font-size:20px;letter-spacing:.05em;color:var(--ink)}
.g{margin:0}
.g img{width:100%;height:auto}
.g figcaption{font:400 11.5px "Noto Serif KR",serif;letter-spacing:.05em;color:var(--mut);margin-top:7px;line-height:1.6}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.pair figcaption{grid-column:1/-1;margin-top:-3px}
.strip .sb{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#2b2926;padding:8px 4px}
.strip span{position:relative}.strip b{position:absolute;left:5px;top:2px;font:400 12px "Cormorant Garamond",serif;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid figcaption{grid-column:1/-1;margin-top:-1px}
.contact{background:#ebe5db;padding:14px}
.contact .ch{display:flex;justify-content:space-between;font:400 10.5px "Cormorant Garamond",serif;letter-spacing:.3em;color:var(--mut);margin-bottom:8px}
.contact .cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.contact b{display:block;font:400 10px "Cormorant Garamond",serif;color:var(--mut);margin-top:2px}
.mosaic{display:grid;grid-template-columns:2fr 1fr;gap:6px;align-items:start}
.mosaic .ms{display:flex;flex-direction:column;gap:6px}.mosaic figcaption{grid-column:1/-1;margin-top:-1px}
.hero{padding:0 35px;text-align:center}.hero figcaption{font-style:italic}
.full{margin:0 -30px;position:relative}.full figcaption{padding:0 30px}
.full .tov{position:absolute;left:0;right:0;bottom:0;padding:40px 30px 14px;color:#fff;font-size:20px;letter-spacing:.3em;background:linear-gradient(transparent,rgba(0,0,0,.42))}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:end}.split figcaption{margin:0 0 3px}
.stack .a{width:74%}.stack .b{width:54%;margin:-40px 0 0 auto;position:relative;border:6px solid var(--paper);box-sizing:border-box}
.overlap .ov{position:relative;padding-bottom:48px}.overlap .a{width:80%}

.cluster{display:grid;grid-template-columns:32% 1fr;gap:12px;align-items:start}.cluster figcaption{margin:2px 0 0}
.cluster .cl{position:relative;padding-bottom:98%}
.cluster .cl img{position:absolute;border:5px solid #fbf9f5;box-shadow:0 2px 8px rgba(0,0,0,.15);box-sizing:border-box}
.cluster .a{right:0;top:0;width:86%}.cluster .b{left:0;top:46%;width:70%}
.vid{margin:0;border:1px solid var(--line);background:#fbf9f5;padding:5px}
.vid video{display:block;width:100%;aspect-ratio:4/3;background:#111}
.vid figcaption{font:400 11.5px "Noto Serif KR",serif;color:var(--mut);padding:7px 3px 2px}
.vid figcaption b{font:400 10px "Cormorant Garamond",serif;letter-spacing:.35em;margin-right:8px}
.one .pin{justify-content:center}

/* 꽉 찬 사진: 사진 전체를 가운데, 남는 곳은 같은 사진을 흐리게 */
.full-bleed .pin{padding:0}
.fp{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:center}
.fp::before{content:"";position:absolute;inset:0;background:rgba(30,26,22,.25)}
.fpi{position:relative;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.fpc{position:absolute;left:0;right:0;bottom:34px;text-align:center;color:#f4ece2;font-size:13px;letter-spacing:.12em;text-shadow:0 1px 6px rgba(0,0,0,.5)}

/* 표지 */
.cover{position:absolute;inset:0;background-size:auto 110%;background-position:50% 50%;background-color:#3b2a20}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,12,8,.62) 0%,rgba(20,12,8,.18) 46%,rgba(20,12,8,0) 64%,rgba(20,12,8,.25) 100%)}
.cover .ct{position:relative;padding:86px 38px 0;color:#fff3e6}
.cover .k{font:400 11px "Cormorant Garamond",serif;letter-spacing:.42em;color:#f3d6b6}
.cover h1{font:800 70px "Nanum Myeongjo",serif;letter-spacing:.12em;margin:18px 0 18px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.cover .cs{font:400 15px/1.9 "Nanum Myeongjo",serif;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.back{position:absolute;inset:0;background-size:cover;display:flex;align-items:center;justify-content:center}
.back::before{content:"";position:absolute;inset:0;background:rgba(30,22,16,.55)}
.back .bk{position:relative;color:#f3e7d8;font:400 26px "Nanum Myeongjo",serif;letter-spacing:.5em}

/* 인트로 */
.intro{position:absolute;inset:0}
.intro .it{position:relative;z-index:2;padding:76px 38px 0}
.intro .big{font:700 23px/1.7 "Nanum Myeongjo",serif;color:var(--ink);margin:0 0 20px}
.intro p{font:400 15px/2 "Nanum Myeongjo",serif;color:var(--txt);margin:0}
.intro img{position:absolute;left:-3%;bottom:0;width:106%;max-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 18%,#000 46%);mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 18%,#000 46%)}

/* 차례 */
.toc{padding:90px 44px}
.toc .tk{font:400 12px "Cormorant Garamond",serif;letter-spacing:.45em;color:var(--mut);margin-bottom:30px}
.toc ol{list-style:none;margin:0;padding:0}

/* 장 시작 */
.chap .pin{background-color:var(--card);background-image:radial-gradient(ellipse at center,transparent 55%,rgba(110,80,45,.14) 100%),url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxODAnIGhlaWdodD0nMTgwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nLjgnIG51bU9jdGF2ZXM9JzMnIHN0aXRjaFRpbGVzPSdzdGl0Y2gnLz48ZmVDb2xvck1hdHJpeCB2YWx1ZXM9JzAgMCAwIDAgLjQgIDAgMCAwIDAgLjMyICAwIDAgMCAwIC4yMiAgMCAwIDAgLjEzIDAnLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0nMTAwJScgaGVpZ2h0PScxMDAlJyBmaWx0ZXI9J3VybCgjbiknLz48L3N2Zz4=")}
.cstart{position:absolute;inset:0;padding:58px 38px 44px;display:flex;flex-direction:column}

.cs-bleed{padding-bottom:0}.cs-bleed .cimg{margin:auto -38px 0}
.cs-bleed .cimg img{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 32%);mask-image:linear-gradient(to bottom,transparent 0,#000 32%)}
.cs-side .cimg{position:absolute;right:0;top:0;width:84%;margin:0}
.cs-side .cimg img{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 42%);mask-image:linear-gradient(to right,transparent 0,#000 42%)}
.cs-side .ctext{margin-top:auto;max-width:72%}

/* 인용, 끝 */

/* 도구: 차례·검색·쪽 이동·사진 크게 보기·전체 화면 */

<script>(function(){

function fill(){document.querySelectorAll('.page.mix .pin').forEach(function(pin){
  var kids=[].filter.call(pin.children,function(e){return getComputedStyle(e).position!=='absolute'});
  if(!kids.length)return; var last=kids[kids.length-1];
  var left=PH-52-(last.offsetTop+last.offsetHeight); if(left<24)return;
  var hasMedia=pin.querySelector('img,video');
  if(!hasMedia){var ps=pin.querySelectorAll('p'),f=15,b=function(){return last.offsetTop+last.offsetHeight};
    while(f<17.5&&b()<PH-52-26){f+=.25;[].forEach.call(ps,function(p){p.style.fontSize=f+'px';p.style.lineHeight=(f*1.87)+'px'})}
    if(b()>PH-52){f-=.25;[].forEach.call(ps,function(p){p.style.fontSize=f+'px';p.style.lineHeight=(f*1.87)+'px'})}
    return;}
  pin.style.justifyContent=kids.length>1?'space-evenly':'center';
});}
var stage=document.getElementById('stage'),cam=document.getElementById('cam'),book=document.getElementById('book'),pf;
var r0=stage.getBoundingClientRect(),MOB=r0.width<r0.height*1.05;   // 세로 화면(휴대폰)은 한 쪽씩

    cam.style.width=mpw+'px';cam.style.height=h+'px';book.style.width=(2*mpw)+'px';book.style.height=h+'px';return;}
  var two=r.width>r.height*1.05,h2=Math.min(r.height,(two?r.width/2:r.width)*PH/PW),w=h2*PW/PH*(two?2:1);
  book.style.width=w+'px';book.style.height=h2+'px';}

// 휴대폰: 펼친 책을 한 쪽 폭으로 들여다본다. 왼쪽 쪽 → (옆으로 이동) → 오른쪽 쪽 → (책장 넘김 + 다시 왼쪽으로)

  book.style.transform='translateX('+(side(i)?-mpw:0)+'px)';}

  var o={width:PW,height:PH,size:'stretch',minWidth:200,maxWidth:2000,minHeight:280,maxHeight:3000,showCover:true,

  if(MOB){var h=Math.floor(mpw*PH/PW);o.width=mpw;o.height=h;o.size='fixed';o.usePortrait=false;o.useMouseEvents=false;

  var $=function(id){return document.getElementById(id)};
  function go(i){closeAll();FB.go(i)}
  // 차례: 장 시작 카드와 소제목에서 만든다
  var t='';pages.forEach(function(pg,i){var h2=pg.querySelector('.cstart h2');if(h2){var rn=pg.querySelector('.cstart .rn');t+='<a class="ch" data-p="'+i+'">'+(rn?rn.textContent+' ':'')+h2.textContent+'<span>'+(i+1)+'쪽</span></a>'}
    [].forEach.call(pg.querySelectorAll('.sh h3'),function(h){t+='<a class="sec" data-p="'+i+'">'+h.textContent+'<span>'+(i+1)+'쪽</span></a>'})});
  $('tocList').innerHTML=t;
  function closeAll(){$('drawer').classList.remove('open');$('search').classList.remove('open')}
  document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=closeAll});
  $('tocBtn').onclick=function(){$('search').classList.remove('open');$('drawer').classList.toggle('open')};
  $('srchBtn').onclick=function(){$('drawer').classList.remove('open');$('search').classList.toggle('open');setTimeout(function(){$('q').focus()},200)};
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('[data-p]');if(a){go(+a.dataset.p)}});
  // 검색
  var texts=pages.map(function(pg){return (pg.innerText||'').replace(/\s+/g,' ')});
  function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  $('q').addEventListener('input',function(){var q=this.value.trim();if(q.length<1){$('res').innerHTML='';return}
    var out='',n=0;texts.forEach(function(tx,i){var k=tx.indexOf(q);if(k<0||n>80)return;n++;
      var s=esc(tx.slice(Math.max(0,k-24),k+q.length+30));out+='<a data-p="'+i+'">'+s.split(esc(q)).join('<mark>'+esc(q)+'</mark>')+'<span>'+(i+1)+'쪽</span></a>'});
    $('res').innerHTML=out||'<div style="padding:14px 16px;color:#8d8780;font-size:13px">찾는 말이 없습니다.</div>'});
  // 쪽 이동 막대
  var sl=$('slider');sl.max=N;sl.value=FB.cur()+1;
  sl.addEventListener('change',function(){go(this.value-1)});
  // 영상을 누를 때만 책장이 넘어가지 않게 (사진은 눌러도 그냥 넘어감)
  var media=function(t){return t&&t.closest&&t.closest('#book video,#book .vid')};
  ['mousedown','mouseup','touchstart','touchend','pointerdown','pointerup'].forEach(function(ev){
    window.addEventListener(ev,function(e){if(media(e.target))e.stopPropagation()},true)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});
  // 전체 화면
  $('fsBtn').onclick=function(){var d=document;try{if(!d.fullscreenElement)d.documentElement.requestFullscreen();else d.exitFullscreen()}catch(x){}};
});
})();
</script></body></html>
